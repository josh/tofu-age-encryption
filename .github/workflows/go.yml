name: Go

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: "test (age ${{ matrix.age_version }}, opentofu ${{ matrix.opentofu_version }})"
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          # nixos-25.11
          - age_version: "1.3.1"
            opentofu_version: "1.10.9"
            go_version: "1.25.9"

          # nixos-26.05
          - age_version: "1.3.1"
            opentofu_version: "1.11.8"
            go_version: "1.26.3"

          # nixpkgs-unstable
          - age_version: "1.3.1"
            opentofu_version: "1.11.8"
            go_version: "1.26.3"

    env:
      AGE_VERSION: ${{ matrix.age_version }}
      TOFU_VERSION: ${{ matrix.opentofu_version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install age
        run: |
          set -o xtrace
          curl --location https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz --output age.tar.gz
          tar -xzf age.tar.gz
          chmod +x age/age
          sudo mv age/age /usr/bin/age

      - name: Install tofu
        run: |
          set -o xtrace
          curl --location https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.tar.gz --output tofu.tar.gz
          tar -xzf tofu.tar.gz
          chmod +x tofu
          sudo mv tofu /usr/bin/tofu

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go_version }}

      - name: Build
        run: |
          go build

      - name: Test
        run: |
          go test
