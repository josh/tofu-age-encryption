name: Lint

on:
  push:
  workflow_dispatch:

jobs:
  go-version:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Go version is compatible with nixpkgs stable
        run: |
          set -euo pipefail
          channel_url="$(curl -fsSL --retry 2 --max-time 30 https://nixos.org/download/ | grep -oE 'https://channels[.]nixos[.]org/nixos-[0-9]{2}[.][0-9]{2}/' | sort -u)"
          [[ "$channel_url" =~ ^https://channels[.]nixos[.]org/(nixos-[0-9]{2}[.][0-9]{2})/$ ]]
          channel="${BASH_REMATCH[1]}"
          available="$(curl -fsSL --compressed --retry 2 --max-time 60 "https://channels.nixos.org/$channel/packages.json.br" | jq -er '.packages.go.version')"
          required="$(awk '$1 == "go" { print $2 }' go.mod)"
          [[ -n "$available" && -n "$required" ]]
          [[ "$(printf '%s\n' "$required" "$available" | sort -V | tail -n 1)" == "$available" ]]
