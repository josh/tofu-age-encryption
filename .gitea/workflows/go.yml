name: Go

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-amd64

    env:
      # renovate: datasource=github-releases depName=FiloSottile/age extractVersion=^v(?<version>.+)$
      AGE_VERSION: "1.3.2"
      # renovate: datasource=github-releases depName=opentofu/opentofu extractVersion=^v(?<version>.+)$
      TOFU_VERSION: "1.13.9"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install age
        run: |
          set -o xtrace
          curl --location https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz --output age.tar.gz
          tar -xzf age.tar.gz
          chmod +x age/age
          sudo mv age/age /usr/bin/age

      - name: Install tofu
        run: |
          set -o xtrace
          curl --location https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.tar.gz --output tofu.tar.gz
          tar -xzf tofu.tar.gz
          chmod +x tofu
          sudo mv tofu /usr/bin/tofu

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          go build

      - name: Test
        run: |
          go test
